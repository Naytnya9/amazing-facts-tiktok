name: Amazing Facts

on:
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install google-genai

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Amazing Fact
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from google import genai

          client = genai.Client(
              api_key=os.environ["GEMINI_API_KEY"]
          )

          prompt = """
          Give me ONE amazing and surprising factual fact.

          Rules:
          - Must be scientifically or historically accurate.
          - Easy for ordinary people to understand.
          - Suitable for a short TikTok video.
          - Maximum 2 sentences.
          - Do not use emojis.
          - Do not make up information.
          """

          response = client.models.generate_content(
              model="gemini-3.6-flash",
              contents=prompt
          )

          fact = response.text.strip()

          print("Generated fact:")
          print(fact)

          with open("fact.txt", "w", encoding="utf-8") as f:
              f.write(fact)
          PY

      - name: Generate AI Voice
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_voice.py

      - name: Create 9:16 Video
        run: |
          python create_video.py

      - name: Check output
        run: |
          echo "===== FACT ====="
          cat fact.txt
          echo "==============="

          echo "===== AUDIO ====="
          ls -lh narration.wav
          echo "================="

          echo "===== VIDEO ====="
          ls -lh amazing_fact.mp4
          echo "================="

      - name: Upload TikTok Video
        uses: actions/upload-artifact@v4
        with:
          name: amazing-fact-video
          path: |
            amazing_fact.mp4
            fact.txt
            narration.wav